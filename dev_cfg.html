<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>board_open_dev_cfg.h 图形编程配置器 v35</title>
<style>
  :root{
    --bg:#0f1420; --panel:#161d2e; --panel2:#1c2438; --line:#2a3550;
    --txt:#e6ebf5; --dim:#8b97b0; --accent:#4f8cff; --accent2:#22c55e;
    --warn:#f59e0b; --danger:#ef4444; --mono:'Consolas','Menlo',monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font-family:system-ui,'Segoe UI','Microsoft YaHei',sans-serif;font-size:14px}
  header{position:sticky;top:0;z-index:20;background:rgba(15,20,32,.96);
         backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
         padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  header h1{font-size:15px;margin:0;font-weight:600;white-space:nowrap}
  header h1 span{color:var(--accent)}
  .search{flex:1;min-width:140px;max-width:280px;position:relative}
  .search input{width:100%;padding:7px 10px 7px 30px;border-radius:8px;
    border:1px solid var(--line);background:var(--panel);color:var(--txt);outline:none}
  .search input:focus{border-color:var(--accent)}
  .search::before{content:"🔍";position:absolute;left:9px;top:7px;font-size:12px;opacity:.7}
  button{cursor:pointer;border:1px solid var(--line);background:var(--panel2);
    color:var(--txt);padding:7px 11px;border-radius:8px;font-size:13px;transition:.15s}
  button:hover{border-color:var(--accent);color:#fff}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button.primary:hover{filter:brightness(1.1)}
  button.ghost{background:transparent}
  .stats{color:var(--dim);font-size:12px;white-space:nowrap}
  .chip-select{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim)}
  .chip-select select{background:var(--panel);color:var(--txt);border:1px solid var(--line);
    border-radius:8px;padding:6px 8px;outline:none;font-size:13px}

  #btnGenHeaderTop{
    white-space:nowrap;
    flex:none;
  }
  @media (max-width: 720px){
    header{
      gap:6px;
    }
    header h1{
      font-size:13px;
      flex:1 1 100%;
    }
    .chip-select{
      order:2;
    }
    .search{
      order:3;
      max-width:none;
      flex:1 1 100%;
    }
    .stats{
      order:4;
    }
    #btnGenHeaderTop{
      order:1;
      margin-left:auto;
      padding:6px 10px;
      font-size:12px;
    }
  }

  main{max-width:1320px;margin:0 auto;padding:16px}
  .tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
  .tabs button{padding:8px 16px;border-radius:10px}
  .tabs button.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

  .group{background:var(--panel);border:1px solid var(--line);border-radius:12px;
         margin-bottom:14px;overflow:hidden}
  .group-head{display:flex;align-items:center;gap:10px;padding:11px 14px;
    cursor:pointer;user-select:none;background:linear-gradient(180deg,#1a2338,#161d2e)}
  .group-head:hover{background:#1e2740}
  .group-head .arrow{transition:.2s;color:var(--dim);font-size:11px}
  .group.collapsed .arrow{transform:rotate(-90deg)}
  .group.collapsed .group-body{display:none}
  .group-head h2{font-size:14px;margin:0;font-weight:600}
  .group-head .badge{font-size:11px;color:var(--dim);font-family:var(--mono);
    background:#0d1220;border:1px solid var(--line);padding:1px 7px;border-radius:20px}
  .group-head .desc{font-size:12px;color:var(--dim);flex:1;text-align:right;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .group-body{padding:4px 0}

  .item{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;
    padding:8px 14px;border-top:1px solid #1f2840}
  .item:first-child{border-top:none}
  .item:hover{background:#1a2236}
  .item.disabled .name{color:var(--dim)}
  .item.disabled .value-box{opacity:.55}
  .item.conflict{background:rgba(239,68,68,.08);border-left:3px solid var(--danger)}
  .item.fixed .switch{visibility:hidden}

  .switch{position:relative;width:38px;height:20px;flex:none}
  .switch input{opacity:0;width:0;height:0}
  .slider{position:absolute;inset:0;background:#2a3550;border-radius:20px;
    transition:.2s;cursor:pointer}
  .slider::before{content:"";position:absolute;width:14px;height:14px;left:3px;top:3px;
    background:#8b97b0;border-radius:50%;transition:.2s}
  .switch input:checked + .slider{background:var(--accent2)}
  .switch input:checked + .slider::before{transform:translateX(18px);background:#fff}

  .meta{min-width:0}
  .name{font-family:var(--mono);font-size:13px;color:#cfe0ff;word-break:break-all}
  .cond{font-size:11px;color:var(--warn);margin-top:2px;font-family:var(--mono)}
  .comment{font-size:11px;color:var(--dim);margin-top:2px;line-height:1.4}

  .value-box{display:flex;align-items:center;gap:6px;min-width:0}
  .value-box input,.value-box select{width:190px;max-width:42vw;padding:5px 8px;border-radius:6px;
    border:1px solid var(--line);background:#0d1220;color:var(--txt);
    font-family:var(--mono);font-size:12px;outline:none}
  .value-box input:focus,.value-box select:focus{border-color:var(--accent)}
  .value-box .novalue{font-size:11px;color:var(--dim);font-style:italic}
  .value-box .type{font-size:10px;padding:1px 6px;border-radius:4px;background:#0d1220;
    border:1px solid var(--line);color:var(--dim);font-family:var(--mono)}

  .io-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
  .io-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
  .io-card.off{opacity:.6}
  .io-card h3{margin:0 0 10px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
  .io-card h3 .dot{width:8px;height:8px;border-radius:50%;background:var(--accent2)}
  .io-card h3 .dot.off{background:var(--dim)}
  .io-card h3 .card-en{display:flex;align-items:center;gap:4px;margin-left:auto;font-size:11px;
    color:var(--dim);font-weight:400; transition: opacity 0.2s;}
  
  /* 新增：使能未勾选时文字变浅 */
  .io-card h3 .card-en.off { opacity: 0.5; }

  .io-card h3 .card-en input{accent-color:var(--accent2)}
  .io-card .card-body.locked{display:none}
  .io-row{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:12px}
  .io-row label{flex:none;width:110px;color:var(--dim)}
  .io-row input,.io-row select{flex:1;min-width:0;padding:4px 7px;border-radius:6px;
    border:1px solid var(--line);background:#0d1220;color:var(--txt);
    font-family:var(--mono);font-size:12px;outline:none}
  .io-row input:focus,.io-row select:focus{border-color:var(--accent)}
  .io-row input[readonly]{opacity:.7;cursor:not-allowed}
  .io-row select:disabled{opacity:.45;cursor:not-allowed}
  .io-row .hint{font-size:11px;color:var(--dim);width:100%;line-height:1.45}
  .io-row input[type=checkbox].inline-chk{flex:none;width:auto;accent-color:var(--accent2)}
  .checks{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:6px}
  .checks label{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--txt);width:auto}
  .checks label.disabled{opacity:.4;cursor:not-allowed}
  .checks input{accent-color:var(--accent)}
  .checks input:disabled{accent-color:var(--dim)}
  .conflict-box{background:rgba(239,68,68,.1);border:1px solid var(--danger);
    border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13px;display:none}
  .conflict-box.show{display:block}
  .conflict-box b{color:var(--danger)}
  .key-card{border:1px dashed var(--line);border-radius:10px;padding:8px 10px;margin:8px 0}
  .key-card .key-title{font-size:12px;color:var(--accent);margin-bottom:4px;font-weight:600}
  .key-card .key-note{font-size:11px;color:var(--dim);margin-top:4px;line-height:1.4}
  .key-card .key-func-val{margin-top:6px;padding:6px 8px;border-radius:6px;
    background:#0d1220;border:1px solid var(--line);font-family:var(--mono);font-size:12px;color:var(--accent2)}
  .sub-card{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:8px 0;background:#131a2a}
  .sub-card .sub-title{font-size:12px;color:var(--accent2);font-weight:600;margin-bottom:4px}
  .usb-chk{display:flex;flex-wrap:wrap;gap:6px 16px;margin:4px 0 6px}
  .usb-chk label{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--txt);width:auto}
  .usb-chk input{accent-color:var(--accent2)}
  .warn-inline{font-size:11px;color:var(--danger);line-height:1.45;margin-top:2px}
  .empty-tip{text-align:center;color:var(--dim);padding:60px 0;font-size:13px}

  .drawer{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:50}
  .drawer.open{display:block}
  .drawer-panel{position:absolute;right:0;top:0;bottom:0;width:min(820px,96vw);
    background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column}
  .drawer-head{display:flex;align-items:center;gap:10px;padding:12px 16px;
    border-bottom:1px solid var(--line);background:var(--panel2)}
  .drawer-head h3{margin:0;font-size:14px;flex:1}
  .drawer-body{flex:1;overflow:auto;padding:0}
  .drawer-body textarea{width:100%;height:100%;border:none;resize:none;outline:none;
    background:#0b0f18;color:#cfe0ff;font-family:var(--mono);font-size:12px;
    line-height:1.55;padding:14px;white-space:pre;overflow:auto}
  .drawer-foot{padding:10px 16px;border-top:1px solid var(--line);
    display:flex;gap:10px;justify-content:flex-end;background:var(--panel2)}
  .toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
    background:var(--accent2);color:#04210f;padding:12px 22px;border-radius:10px;
    font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:99;
    box-shadow:0 8px 28px rgba(0,0,0,.45);text-align:center;max-width:80vw}
  .toast.show{opacity:1;transform:translate(-50%,-50%)}

  /* 底部居中的红色提示 */
  .toast.bottom{
    top:auto;
    bottom:120px;
    left:50%;
    transform:translate(-50%,14px);
    background:var(--danger);
    color:#fff;
    font-weight:600;
    font-size:13px;
    line-height:1.55;
    text-align:center;
    white-space:normal;
    padding:12px 20px;
    border-radius:10px;
    max-width:min(620px,90vw);
    border:1px solid rgba(255,255,255,.18);
  }
  .toast.bottom.show{opacity:1;transform:translate(-50%,0)}

  .hidden{display:none!important}

  .modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;z-index:60;
    align-items:center;justify-content:center}
  .modal.open{display:flex}
  .modal-box{background:var(--panel);border:1px solid var(--danger);border-radius:14px;
    width:min(520px,92vw);max-height:80vh;display:flex;flex-direction:column;
    box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .modal-head{display:flex;align-items:center;gap:10px;padding:14px 16px;
    border-bottom:1px solid var(--line);background:rgba(239,68,68,.12)}
  .modal-head h3{margin:0;font-size:15px;color:var(--danger);flex:1}
  .modal-body{padding:14px 16px;overflow:auto;font-size:13px;line-height:1.6}
  .modal-body .c-item{margin:6px 0;padding:8px 10px;border-radius:8px;
    background:#0d1220;border:1px solid var(--line);font-family:var(--mono);font-size:12px}
  .modal-body .c-item .io{color:var(--warn);font-weight:600}
  .modal-foot{padding:12px 16px;border-top:1px solid var(--line);
    display:flex;justify-content:flex-end;gap:10px;background:var(--panel2)}

  .echo-en-label,
  .touch-en-label{
    font-weight:700 !important;
    color:var(--accent2) !important;
  }

  .io-output-bar{
    margin:20px 0 40px;padding:16px;border:1px dashed var(--accent);
    border-radius:12px;background:rgba(79,140,255,.06);
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  }
  .io-output-bar .io-output-tip{font-size:12px;color:var(--dim)}

  .item-wrap{border-top:1px solid #1f2840}
  .item-wrap:first-child{border-top:none}
  .sub-items{padding:2px 14px 10px 58px;display:flex;flex-direction:column;gap:6px}
  .sub-item{display:flex;align-items:center;gap:10px;font-size:12px;
    padding:4px 8px;border-radius:8px;background:#131a2a;border:1px solid #1f2840}
  .sub-item label{color:var(--dim);flex:none;width:150px}
  .sub-item select,.sub-item input[type=number]{flex:1;min-width:0;padding:4px 7px;border-radius:6px;
    border:1px solid var(--line);background:#0d1220;color:var(--txt);
    font-family:var(--mono);font-size:12px;outline:none}
  .sub-item .hint{font-size:11px;color:var(--dim)}
  .multi-select{display:flex;flex-wrap:wrap;gap:6px 14px;padding:4px 0}
  .multi-select label{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--txt)}
  .multi-select input{accent-color:var(--accent2)}
  .lcd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px;padding:6px 0}
  .lcd-grid label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--txt);
    padding:4px 8px;border-radius:8px;background:#131a2a;border:1px solid #1f2840}
  .lcd-grid input{accent-color:var(--accent2)}
  .eye-row{display:flex;flex-wrap:wrap;gap:8px 18px;padding:4px 0}
  .eye-row label{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--txt)}
  .eye-row input{accent-color:var(--accent2)}

  .group[data-group="通用配置"] .group-body,
  .group[data-group="产品配置"] .group-body{counter-reset:genitem}
  .group[data-group="通用配置"] .item .name::before,
  .group[data-group="产品配置"] .item .name::before{
    counter-increment:genitem;
    content:counter(genitem) ". ";
    color:var(--accent);
    font-weight:700;
    margin-right:2px;
  }

  .spi-warn-tip{
    font-size:12px;
    color:var(--warn);
    line-height:1.45;
    margin:4px 0 6px;
    padding:6px 8px;
    border:1px dashed var(--warn);
    border-radius:8px;
    background:rgba(245,158,11,.08);
  }

  .mgp-input{
    flex:1;min-width:0;padding:4px 7px;border-radius:6px;
    border:1px solid var(--line);background:#0d1220;color:var(--txt);
    font-family:var(--mono);font-size:12px;outline:none;
  }
  .mgp-input:focus{border-color:var(--accent)}
  .mgp-input.err{border-color:var(--danger);box-shadow:0 0 0 2px rgba(239,68,68,.25)}
  .sub-item label.mgp-label{width:180px}

  .bt-name-input{
    flex:1;min-width:0;padding:4px 7px;border-radius:6px;
    border:1px solid var(--line);background:#0d1220;color:var(--txt);
    font-family:var(--mono);font-size:12px;outline:none;
  }
  .bt-name-input:focus{border-color:var(--accent)}
  .bt-name-input.err{border-color:var(--danger);box-shadow:0 0 0 2px rgba(239,68,68,.25)}
  .bt-name-bytes{font-size:11px;color:var(--dim);white-space:nowrap}
  .bt-name-bytes.err{color:var(--danger);font-weight:600}

  .mutex-tag{
    font-size:11px;color:var(--warn);font-weight:400;white-space:nowrap;
  }

  /* 抽屉顶部按钮组 */
  .drawer-head .drawer-head-actions{
    display:flex;align-items:center;gap:8px;flex:none;
  }

  /* “复制”按钮旁的局部提示气泡 */
  .copy-bubble-wrap{
    position:relative;display:inline-flex;align-items:center;
  }
  .copy-bubble{
    position:absolute;
    left:50%;
    bottom:calc(100% + 8px);
    transform:translateX(-50%) translateY(4px);
    background:var(--accent2);
    color:#04210f;
    font-weight:600;
    font-size:12px;
    padding:5px 10px;
    border-radius:8px;
    white-space:nowrap;
    opacity:0;
    pointer-events:none;
    transition:opacity .18s ease, transform .18s ease;
    z-index:80;
    box-shadow:0 6px 18px rgba(0,0,0,.35);
  }
  .copy-bubble::after{
    content:"";
    position:absolute;
    left:50%;
    top:100%;
    transform:translateX(-50%);
    border:5px solid transparent;
    border-top-color:var(--accent2);
  }
  .copy-bubble.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
  /* 重绘原生复选框，确保勾选后百分之百为绿色 */
  input[type="checkbox"] {
	  appearance: none;
	  -webkit-appearance: none;
	  width: 14px;
	  height: 14px;
	  border: 1px solid var(--line);
	  border-radius: 3px;
	  background: #0d1220;
	  cursor: pointer;
	  position: relative;
	  vertical-align: middle;
	  margin: 0 4px 0 0;
	}

	/* 勾选后的底色（绿色） */
	input[type="checkbox"]:checked {
	  background-color: var(--accent2) !important;
	  border-color: var(--accent2) !important;
	}

	/* 勾选后的白色对勾（用纯CSS画一个对勾） */
	input[type="checkbox"]:checked::after {
	  content: "";
	  position: absolute;
	  left: 4px;
	  top: 1px;
	  width: 3px;
	  height: 7px;
	  border: solid #fff;
	  border-width: 0 2px 2px 0;
	  transform: rotate(45deg);
	}

	/* 覆盖禁用状态，防止浏览器再次强制置灰 */
	input[type="checkbox"]:disabled {
	  opacity: 1 !important;
	  cursor: not-allowed;
	}
</style>
</head>
<body>

<header>
  <h1>⚙️ <span>board_open_dev_cfg.h</span> 图形编程配置器 v35</h1>
  <div class="chip-select">
    芯片/模组
    <select id="chipSelect">
      <option value="QYAI-AC-A100模组" selected>QYAI-AC-A100模组</option>
      <option value="AC7916AB">AC7916AB</option>
      <option value="AC7911BA">AC7911BA</option>
      <option value="AC7911BB">AC7911BB</option>
    </select>
  </div>
  <div class="search"><input id="search" placeholder="搜索宏名 / 注释 / 分组…" autocomplete="off"></div>
  <span class="stats" id="stats"></span>
  <button class="primary" id="btnGenHeaderTop">📄 点击生成配置文件</button>
  <button class="ghost" id="btnResetCfg">↺ 恢复默认</button>
  <span class="io-output-tip" style="color:var(--warn);font-size:12px;line-height:1.45;max-width:520px;">
    注意：在SDK运行dev_cfg.html文件，点击生成配置文件后需要手动替换SDK\apps\wifi_story_machine\board\wl82\board_open_dev_cfg.h的配置文件（网页版编程的请忽略）
  </span>
</header>

<main>
  <div class="tabs">
    <button class="active" data-tab="io">外设 IO 配置</button>
    <button data-tab="macro">功能模块</button>
  </div>

  <div id="conflictBox" class="conflict-box"></div>

  <div id="tab-macro" class="hidden"><div id="app"></div></div>
  <div id="tab-io">
    <div class="io-grid" id="ioGrid"></div>
  </div>
</main>

<div class="drawer" id="drawer">
  <div class="drawer-panel">
    <div class="drawer-head">
      <h3>生成结果 · board_open_dev_cfg.h</h3>
      <div class="drawer-head-actions">
        <span class="copy-bubble-wrap">
          <button class="ghost" id="btnCopy">复制</button>
          <span class="copy-bubble" id="copyBubble">已复制</span>
        </span>
        <button class="primary" id="btnDownload">输出配置文件</button>
        <button class="ghost" id="btnCloseDrawer">关闭</button>
      </div>
    </div>
    <div class="drawer-body"><textarea id="output" spellcheck="false"></textarea></div>
  </div>
</div>

<div class="modal" id="conflictModal">
  <div class="modal-box">
    <div class="modal-head">
      <h3>⚠ IO / USB 冲突</h3>
      <button class="ghost" id="btnCloseConflict">关闭</button>
    </div>
    <div class="modal-body" id="conflictModalBody"></div>
    <div class="modal-foot">
      <button class="primary" id="btnCloseConflict2">我知道了</button>
    </div>
  </div>
</div>

<div class="modal" id="tipModal">
  <div class="modal-box" style="border-color:var(--warn)">
    <div class="modal-head" style="background:rgba(245,158,11,.12)">
      <h3 style="color:var(--warn)">提示</h3>
      <button class="ghost" id="btnCloseTip">关闭</button>
    </div>
    <div class="modal-body" id="tipModalBody"></div>

/* ============================================================
 * 0.0 页面配置持久化（localStorage，键名 dev_html.cfg）
 * ============================================================ */
const STORAGE_KEY = "dev_html.cfg";

function saveCfg(){
  try{
    const data = {
      chip: IO_STATE.chip,
      flashSize: IO_STATE.flashSize,
      MODULE_STATE,
      IO_STATE
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }catch(e){
    console.warn("saveCfg failed", e);
  }
}

function loadCfg(){
  let raw = null;
  try{
    raw = localStorage.getItem(STORAGE_KEY);
  }catch(e){
    return;
  }
  if(!raw) return;
  let data = null;
  try{
    data = JSON.parse(raw);
  }catch(e){
    return;
  }
  if(!data || typeof data !== "object") return;

  if(data.MODULE_STATE && typeof data.MODULE_STATE === "object"){
    for(const gk of Object.keys(MODULE_STATE)){
      if(!data.MODULE_STATE[gk]) continue;
      if(typeof MODULE_STATE[gk] === "object" && !Array.isArray(MODULE_STATE[gk])){
        Object.assign(MODULE_STATE[gk], data.MODULE_STATE[gk]);
        if(gk === "system" && data.MODULE_STATE.system.autoSleepCfg){
          Object.assign(MODULE_STATE.system.autoSleepCfg, data.MODULE_STATE.system.autoSleepCfg);
        }
        if(gk === "av" && data.MODULE_STATE.av.micGainParams){
          Object.assign(MODULE_STATE.av.micGainParams, data.MODULE_STATE.av.micGainParams);
        }
        if(gk === "av" && data.MODULE_STATE.av.ui){
          Object.assign(MODULE_STATE.av.ui, data.MODULE_STATE.av.ui);
        }
      } else {
        MODULE_STATE[gk] = data.MODULE_STATE[gk];
      }
    }
  }

  if(data.IO_STATE && typeof data.IO_STATE === "object"){
    const S = data.IO_STATE;
    if(S.chip && CHIP_IO[S.chip]) IO_STATE.chip = S.chip;
    if(S.flashSize) IO_STATE.flashSize = S.flashSize;

    for(const key of Object.keys(IO_STATE)){
      if(!S[key]) continue;
      const cur = IO_STATE[key];
      const src = S[key];
      if(Array.isArray(cur)){
        IO_STATE[key] = src;
      } else if(cur && typeof cur === "object"){
        Object.assign(cur, src);
        if(Array.isArray(src.list)) cur.list = src.list;
        if(Array.isArray(src.keys)) cur.keys = src.keys;
        if(Array.isArray(src.dual)) cur.dual = src.dual;
        if(Array.isArray(src.usbIfs)) cur.usbIfs = src.usbIfs;
        if(Array.isArray(src.micGainParams)) cur.micGainParams = src.micGainParams;
      } else {
        IO_STATE[key] = src;
      }
    }
  }

  const chipSel = $("chipSelect");
  if(chipSel && IO_STATE.chip) chipSel.value = IO_STATE.chip;

  normalizeDacMode();
  normalizeUsbIfs();
}

function keyFuncToInt(funcs){
  let v = 0;
  KEY_SLOTS.forEach(s=>{
    const n = Number(funcs && funcs[s.key]) || 0;
    const [lo,hi] = s.bits;
    const mask = ((1 << (hi-lo+1)) - 1);
    v |= (n & mask) << lo;
  });
  return v >>> 0;
}
function keyFuncToHex(funcs){
  return "0x" + keyFuncToInt(funcs).toString(16).toUpperCase().padStart(8,"0");
}

    if(!DAC_SINGLE_DIFF_OPTIONS.some(x=>x.value===IO_STATE.dac.singleDiff)){

  const opt = DAC_SINGLE_DIFF_OPTIONS.find(x=>x.value===IO_STATE.dac.singleDiff) || DAC_SINGLE_DIFF_OPTIONS[0];

  return IO_STATE.chip === "AC7916AB" || IO_STATE.chip === "QYAI-AC-A100模组";

  return IO_STATE.chip === "AC7911BA" || IO_STATE.chip === "AC7911BB";

function normalizeUsbIfs(){
  const list = usbIfList();
  const norm = arr => {
    let a = Array.isArray(arr) ? arr.filter(x=>list.includes(x)) : [];
    a = Array.from(new Set(a));
    if(a.length === 0) a = [list[0]];
    if(!usbDualIfSupported() && a.length > 1) a = [a[0]];
    return a;
  };
  IO_STATE.lte.usbIfs = norm(IO_STATE.lte.usbIfs);
  IO_STATE.udisk.usbIfs = norm(IO_STATE.udisk.usbIfs);
}
function usbUsage(){
  const map = { FUSB: [], HUSB: [] };
  if(IO_STATE.lte.enable){
    IO_STATE.lte.usbIfs.forEach(x=>{ if(map[x]) map[x].push("4G/LTE"); });
  }
  if(IO_STATE.udisk.enable){
    IO_STATE.udisk.usbIfs.forEach(x=>{ if(map[x]) map[x].push("U盘"); });
  }
  return map;
}
function usbConflicts(){
  const m = usbUsage();
  const out = [];
  ["FUSB","HUSB"].forEach(k=>{
    if(m[k].length > 1) out.push({ iface:k, owners:m[k] });
  });
  return out;
}
function usbIfsToOtgVal(ifArr){
  const hasF = ifArr.includes("FUSB");
  const hasH = ifArr.includes("HUSB");
  if(hasF && hasH) return "0x3";
  if(hasF) return "0x1";
  if(hasH) return "0x2";
  return "0x0";
}
function computeUsbOtgVal(){
  const set = new Set();
  if(IO_STATE.udisk.enable) IO_STATE.udisk.usbIfs.forEach(x=>set.add(x));
  if(IO_STATE.lte.enable)   IO_STATE.lte.usbIfs.forEach(x=>set.add(x));
  if(set.size === 0) return null;
  return usbIfsToOtgVal(Array.from(set));
}

function sizeToBytes(s){
  const m = String(s).trim().match(/^([\d.]+)\s*(MB|M|KB|K|B)?$/i);
  if(!m) return 0;
  const n = parseFloat(m[1]);
  const unit = (m[2]||"").toUpperCase();
  if(unit === "MB" || unit === "M") return Math.round(n * 1048576);
  if(unit === "KB" || unit === "K") return Math.round(n * 1000);
  return Math.round(n);
}
function baudToNumber(preset, custom){
  if(preset === "3.3M") return 3300000;
  if(preset === "2.5M") return 2500000;
  if(preset === "其他") return Number(custom) || 0;
  return Number(preset) || 0;
}

function valueType(v){
  if(v===null) return "NOVAL";
  if(typeof v==="number") return Number.isInteger(v)?"INT":"FLOAT";
  if(typeof v==="boolean") return "BOOL";
  return "STR";
}
function parseValue(raw){
  const s = raw.trim();
  if(s==="") return null;
  if(/^-?\d+$/.test(s)) return parseInt(s,10);
  if(/^-?\d+\.\d+$/.test(s)) return parseFloat(s);
  if(s==="true") return true;
  if(s==="false") return false;
  return s;
}

function parseLinearExpr(str){
  const s = String(str || "").replace(/\s+/g, "");
  const body = s.replace(/^[yY]=/, "");
  const m = body.match(/^([+-]?\d*\.?\d*)x([+-]\d*\.?\d*)?$/i);
  if(!m){
    return { slope: 0, intercept: 0, ok:false };
  }
  let slopeStr = m[1];
  if(slopeStr === "" || slopeStr === "+") slopeStr = "1";
  if(slopeStr === "-") slopeStr = "-1";
  const slope = parseFloat(slopeStr);
  const intercept = m[2] ? parseFloat(m[2]) : 0;
  if(isNaN(slope) || isNaN(intercept)){
    return { slope: 0, intercept: 0, ok:false };
  }
  return { slope, intercept, ok:true };
}

function utf8ByteLength(str){
  let n = 0;
  const s = String(str || "");
  for(let i = 0; i < s.length; i++){
    const c = s.charCodeAt(i);
    if(c <= 0x7F) n += 1;
    else if(c <= 0x7FF) n += 2;
    else if(c >= 0xD800 && c <= 0xDBFF){
      n += 4;
      i++;
    }
    else n += 3;
  }
  return n;
}

/* 统一 IO 下拉：被占用的 IO 不隐藏，而是 disabled + 灰色 + 标注占用模块 */
function ioSelect(id, value, opts, banned, selfId, allowEmpty){
  const used = collectUsage();
  let html = `<select id="${id}">`;
  if(allowEmpty){
    html += `<option value="${IO_EMPTY}" ${value===IO_EMPTY?'selected':''}>${IO_EMPTY}</option>`;
  }
  const added = new Set();
  opts.forEach(o=>{
    if(added.has(o)) return;
    added.add(o);
    if(banned && banned.has(o)){
      // 被禁用名单排除的 IO 不显示（这些是芯片保留脚）
      return;
    }
    const owners = (used[o] || []).filter(x=>x.id !== selfId);
    const occupied = owners.length > 0;
    const isSelf = value === o;
    let label = o;
    let dis = "";
    let style = "";
    if(occupied && !isSelf){
      label = `${o}（已被${owners.map(x=>x.label).join("/")}占用）`;
      dis = "disabled";
      style = `style="opacity:.45;cursor:not-allowed"`;
    }
    html += `<option value="${o}" ${isSelf?'selected':''} ${dis} ${style}>${label}</option>`;
  });
  // 若当前值不在 opts 中（例如切换芯片后遗留），仍补一个选项，避免空白
  if(value && value !== IO_EMPTY && !added.has(value)){
    const owners = (used[value] || []).filter(x=>x.id !== selfId);
    const occupied = owners.length > 0;
    let label = value;
    let dis = "";
    let style = "";
    if(occupied){
      label = `${value}（已被${owners.map(x=>x.label).join("/")}占用）`;
      dis = "disabled";
      style = `style="opacity:.45;cursor:not-allowed"`;
    }
    html += `<option value="${value}" selected ${dis} ${style}>${label}</option>`;
  }
  html += `</select>`;
  return html;
}

function moduleItemHtml(opts){
  const { group, key, name, comment, type, value, min, max, options, enabled, fixed } = opts;
  const dis = enabled ? "" : "disabled";
  const itemCls = `item ${enabled?'':'disabled'} ${fixed?'fixed':''}`;
  let valueHtml = "";
  if(type === "number"){
    valueHtml = `<input type="number" data-mod="${group}.${key}" value="${esc(value)}"
      ${min!==undefined?`min="${min}"`:""} ${max!==undefined?`max="${max}"`:""} ${dis}>`;
  } else if(type === "select"){
    valueHtml = `<select data-mod="${group}.${key}" ${dis}>
      ${options.map(o=>`<option value="${esc(o.v)}" ${String(o.v)===String(value)?'selected':''}>${esc(o.n)}</option>`).join("")}
    </select>`;
  } else if(type === "bool"){
    valueHtml = `<select data-mod="${group}.${key}" ${dis}>
      <option value="1" ${value?'selected':''}>开启</option>
      <option value="0" ${!value?'selected':''}>关闭</option>
    </select>`;
  } else if(type === "text"){
    valueHtml = `<input type="text" data-mod="${group}.${key}" value="${esc(value)}" ${dis}>`;
  }
  return `<div class="${itemCls}" data-mod-group="${group}" data-mod-key="${key}">
    <label class="switch" ${fixed?'style="visibility:hidden"':''}>
      <input type="checkbox" data-mod-en="${group}.${key}" ${enabled?'checked':''} ${fixed?'disabled':''}>
      <span class="slider"></span>
    </label>
    <div class="meta">
      <div class="name">${esc(name)}</div>
      ${comment?`<div class="comment">${esc(comment)}</div>`:""}
    </div>
    <div class="value-box">
      <span class="type">${type==="number"?"INT":type==="bool"?"BOOL":"STR"}</span>
      ${valueHtml}
    </div>
  </div>`;
}

  }

  {
    const gk = "网络配置";
    const g = MODULE_STATE.network;
    const items = [
      { key:"ttsReply", name:"唤醒回复语启用在线TTS", comment:"", type:"bool", value:g.ttsReply, enabled:g.ttsReply },
      { key:"moreNotice", name:"聊天多次提示回复语", comment:"", type:"bool", value:g.moreNotice, enabled:g.moreNotice },

    const filtered = items.filter(it=>!kw || (it.name+" "+(it.comment||"")).toLowerCase().includes(kw));

    if(!kw || filtered.length > 0){
      html += `<section class="group ${collapsed[gk]?'collapsed':''}" data-group="${gk}">
        <div class="group-head" data-toggle="${gk}">
          <span class="arrow">▼</span><h2>${esc(gk)}</h2>

  }

    {
    const gk = "系统配置";
    const g = MODULE_STATE.system;
    const items = [
      { key:"firstPowerOff", name:"首次上电开机关机", comment:"", type:"bool", value:g.firstPowerOff, enabled:g.firstPowerOff },
      { key:"vbatCheck", name:"电量检测", comment:"", type:"bool", value:g.vbatCheck, enabled:g.vbatCheck }
    ];
    const autoSleepItem = { key:"autoSleep", name:"待机自动低功耗休眠", comment:"", type:"bool", value:g.autoSleep, enabled:g.autoSleep };
    const filtered = items.filter(it=>!kw || (it.name+" "+(it.comment||"")).toLowerCase().includes(kw));
    const autoSleepMatch = !kw || (autoSleepItem.name+" "+(autoSleepItem.comment||"")).toLowerCase().includes(kw);
    total += items.length + 1; shown += filtered.length + (autoSleepMatch?1:0);
    if(!kw || filtered.length > 0 || autoSleepMatch){
      html += `<section class="group ${collapsed[gk]?'collapsed':''}" data-group="${gk}">
        <div class="group-head" data-toggle="${gk}">
          <span class="arrow">▼</span><h2>${esc(gk)}</h2>
          <span class="badge">${items.length+1} 项 · ${items.filter(i=>i.enabled).length + (autoSleepItem.enabled?1:0)} 启用</span>
          <span class="desc">系统配置</span>
        </div>
        <div class="group-body">`;

        const btBytes = utf8ByteLength(btNameVal);
        const btErr = btBytes > BT_NAME_MAX_BYTES;

          <div class="item" style="grid-template-columns:44px 1fr auto;">

          </div>

      }
      /* 待机自动低功耗休眠：开关行 + 子配置 */
      if(autoSleepMatch){
        html += moduleItemHtml({ group:"system", ...autoSleepItem });
        const asCfg = g.autoSleepCfg;
        const autoSleepEnabled = g.autoSleep;

        html += `<div class="item-wrap">
          <div class="sub-items">

                  <input type="checkbox" id="deepSleepEn" ${asCfg.deepSleepEn?'checked':''} ${autoSleepEnabled?'':'disabled'} style="accent-color:var(--accent2)"> 开启

              </div>
            </div>
          </div>
        </div>`;
      }
      html += `</div></section>`;
    }
  }

  {
    const gk = "量产配置";
    const g = MODULE_STATE.test;
    const isQYAI = IO_STATE.chip === "QYAI-AC-A100模组";
    const items = [];
    if(isQYAI){
      items.push({ key:"moduleProdTest", name:"模组产测模式", comment:"", type:"bool", value:g.moduleProdTest, enabled:g.moduleProdTest });
    }
    items.push({ key:"allFuncTest", name:"量产所有功能测试模式", comment:"触发所有功能，连接WIFI-PD-TEST，密码12345678，自测麦克风，开启PD_TEST经典蓝牙，屏幕颜色显示", type:"bool", value:g.allFuncTest, enabled:g.allFuncTest });

    const filtered = items.filter(it=>!kw || (it.name+" "+(it.comment||"")).toLowerCase().includes(kw));
    total += items.length; shown += filtered.length;
    if(!kw || filtered.length > 0){
      html += `<section class="group ${collapsed[gk]?'collapsed':''}" data-group="${gk}">
        <div class="group-head" data-toggle="${gk}">
          <span class="arrow">▼</span><h2>${esc(gk)}</h2>
          <span class="badge">${items.length} 项 · ${items.filter(i=>i.enabled).length} 启用</span>

      html += `<div class="item-wrap">

      for(const it of filtered){
        html += moduleItemHtml({ group:"test", ...it });
      }
      if(isQYAI && g.moduleProdTest){
        html += `<div class="item-wrap">
          <div class="sub-items">
            <div class="sub-card">
              <div class="sub-title">触发模组量产测试功能的 IO 配置</div>
              <div class="sub-item">
                <label>触发 IO</label>
                ${ioSelect("prodTestPort", g.moduleProdTestPort, chipIOs(), null, "test.moduleProdTestPort", false)}
              </div>
            </div>
          </div>
        </div>`;
      }
      html += `</div></section>`;
    }
  }

  if(!html) html = `<div class="empty-tip">没有匹配的功能模块项</div>`;
  app.innerHTML = html;
  $("stats").textContent = kw ? `匹配 ${shown} / 共 ${total} 项` : `共 ${total} 项`;

  app.querySelectorAll("[data-toggle]").forEach(head=>{
    head.onclick = e=>{
      if(e.target.closest(".switch")) return;
      const g = head.dataset.toggle;
      collapsed[g] = !collapsed[g];
      renderMacro();
    };
  });

  app.querySelectorAll("[data-mod-en]").forEach(cb=>{
    cb.onchange = e=>{
      const [group,key] = e.target.dataset.modEn.split(".");
      if(group==="general" || group==="product") return;
      MODULE_STATE[group][key] = e.target.checked;

      /* 量产配置：任一选项开启后，屏幕下方中间弹出红色提示，8 秒后消失 */
      if(group === "test" && e.target.checked){
        warnToast("请确保麦克风调试完毕，并把“线性曲线函数”填到了“麦克风/回采增益参数”各个选项", 8000);
      }

      renderMacro();
    };
  });

    app.querySelectorAll("[data-mod]").forEach(inp=>{
    const handle = (e, isInputEvent)=>{
      const [group,key] = e.target.dataset.mod.split(".");
      let v = e.target.value;

      /* ---- 产品配置：批次 / 数量允许清空 ---- */
      if(group==="product"){
        if(key === "companyUuid" || key === "productName"){
          // 只保留英文、数字、符号（ASCII 可见字符 0x20~0x7E，去掉空格）
          const cleaned = String(v).replace(/[^\x21-\x7E]/g, "");
          MODULE_STATE.product[key] = cleaned;
          if(cleaned !== v){
            e.target.value = cleaned; // 实时回显过滤后的值
          }
          saveCfg();
          return;
        }
        // 批次 / 数量：空串 或 数值0 都视为清空
        if(String(v).trim() === "" || Number(v) === 0){
          MODULE_STATE.product[key] = "";
          saveCfg();
          e.target.value = "";   // 无条件清空显示
          return;
        }
        let n = Number(v);
        if(isNaN(n)) n = "";
        else n = Math.max(1, Math.min(1000, n));
        MODULE_STATE.product[key] = n;
        if(!isInputEvent && n !== "" && String(n) !== String(v)){
          e.target.value = n;
        }
        saveCfg();
        return;
      }

      /* ---- 通用配置 ---- */
      if(group==="general"){
        if(key === "wakeWord"){
          // 字符串选项，直接保存
        } else {
          v = Number(v);
          if(isNaN(v)) v = 0;
          const limits = {
            volumeStep:[1,10], gainStep:[1,10], minVolume:[1,10], maxVolume:[10,100],
            initVolume:[MODULE_STATE.general.minVolume, MODULE_STATE.general.maxVolume],
            hwVolume:[10,100], prodTestVolume:[10,100]
          };
          if(limits[key]){
            v = Math.max(limits[key][0], Math.min(limits[key][1], v));
          }
        }
      } else if(key==="micGain"){
        v = Number(v);
        if(isNaN(v)) v = 0;
      } else if(e.target.tagName==="SELECT" && e.target.options[e.target.selectedIndex].value==="1"){
        v = true;
      } else if(e.target.tagName==="SELECT" && e.target.options[e.target.selectedIndex].value==="0"){
        v = false;
      }
      MODULE_STATE[group][key] = v;
      if(!isInputEvent) renderMacro(); // change 时才重渲染，避免 input 时打断
    };

    inp.oninput = e=>handle(e, true);
    inp.onchange = e=>handle(e, false);
  });

  app.querySelectorAll("[data-mgp]").forEach(inp=>{
    inp.onchange = e=>{
      const k = e.target.dataset.mgp;
      const val = e.target.value;
      const r = parseLinearExpr(val);
      if(!r.ok){
        e.target.classList.add("err");
        openTip(`麦克风/回采增益参数 <b>${esc(k)}</b> 格式错误。<br><br>请按 <b>y = ax + b</b> 的格式填写，例如：<code>y = -0.5x + 80</code>。<br>支持省略 y=、空格，以及 a 为 +1/-1 的简写（如 <code>x + 5</code>）。`);
        return;
      }
      e.target.classList.remove("err");
      MODULE_STATE.av.micGainParams[k] = val;
      saveCfg();
    };
    const r = parseLinearExpr(inp.value);
    inp.classList.toggle("err", !r.ok);
  });

  if($("uiEnable")) $("uiEnable").onchange = e=>{
    MODULE_STATE.av.ui.enable = e.target.checked;
    renderMacro();
  };

  app.querySelectorAll('input[name="lcdDriver"]').forEach(r=>{
    r.onchange = e=>{
      if(e.target.checked){
        MODULE_STATE.av.ui.driver = e.target.value;
        renderMacro();
      }
    };
  });
  if($("lcdW")) $("lcdW").onchange = e=>{ MODULE_STATE.av.ui.lcdW = +e.target.value; saveCfg(); };
  if($("lcdH")) $("lcdH").onchange = e=>{ MODULE_STATE.av.ui.lcdH = +e.target.value; saveCfg(); };
  if($("uiTwoEye")) $("uiTwoEye").onchange = e=>{ MODULE_STATE.av.ui.twoEye = e.target.checked; saveCfg(); };
  app.querySelectorAll('input[name="eyeFile"]').forEach(r=>{
    r.onchange = e=>{
      if(e.target.checked){
        MODULE_STATE.av.ui.aviEye = e.target.value==="avi";
        MODULE_STATE.av.ui.gifEye = e.target.value==="gif";
        saveCfg();
      }
    };
  });

  /* 待机自动低功耗休眠子选项 */
  if($("lowPowerEn")) $("lowPowerEn").onchange = e=>{
    MODULE_STATE.system.autoSleepCfg.lowPowerEn = e.target.checked;
    renderMacro();
  };
  if($("deepSleepEn")) $("deepSleepEn").onchange = e=>{
    MODULE_STATE.system.autoSleepCfg.deepSleepEn = e.target.checked;
    renderMacro();
  };
  if($("autoPowerOffEn")) $("autoPowerOffEn").onchange = e=>{
    MODULE_STATE.system.autoSleepCfg.autoPowerOffEn = e.target.checked;
    renderMacro();
  };
  if($("lowPowerSec")) $("lowPowerSec").onchange = e=>{ MODULE_STATE.system.autoSleepCfg.lowPowerSec = +e.target.value; saveCfg(); };
  if($("deepSleepMin")) $("deepSleepMin").onchange = e=>{ MODULE_STATE.system.autoSleepCfg.deepSleepMin = +e.target.value; saveCfg(); };
  if($("autoPowerOffMin")) $("autoPowerOffMin").onchange = e=>{ MODULE_STATE.system.autoSleepCfg.autoPowerOffMin = +e.target.value; saveCfg(); };

  if($("btNameInput")){
    const btInput = $("btNameInput");
    const btBytesEl = btInput.parentElement.querySelector(".bt-name-bytes");
    btInput.oninput = e=>{
      const bytes = utf8ByteLength(e.target.value);
      const over = bytes > BT_NAME_MAX_BYTES;
      btInput.classList.toggle("err", over);
      if(btBytesEl){
        btBytesEl.textContent = `${bytes} / ${BT_NAME_MAX_BYTES} 字节`;
        btBytesEl.classList.toggle("err", over);
      }
    };
    btInput.onchange = e=>{
      const val = e.target.value;
      const bytes = utf8ByteLength(val);
      if(bytes > BT_NAME_MAX_BYTES){
        openTip(`经典蓝牙名称 <b>${esc(val)}</b> 共 <b>${bytes}</b> 字节，超过 ${BT_NAME_MAX_BYTES} 字节限制（UTF-8 编码）。<br><br>中文每个字符通常占 3 字节，英文/数字占 1 字节。请缩短名称。`);
        renderMacro();
        return;
      }
      MODULE_STATE.system.btName = val;
      renderMacro();
    };
  }

  if($("prodTestPort")) $("prodTestPort").onchange = e=>{
    MODULE_STATE.test.moduleProdTestPort = e.target.value;
    renderMacro();
  };

  saveCfg();
}

/* ============================================================
 * 5. IO 配置渲染
 * ============================================================ */
function cardHead(title, enId, enabled, extra=""){
  return `<h3><span class="dot ${enabled?'':'off'}"></span>${title}
    <label class="card-en"><input type="checkbox" id="${enId}" ${enabled?'checked':''}> 使能</label>
    ${extra}
  </h3>`;
}

function usbIfCheckboxHtml(ownerKey){
  const list = usbIfList();
  const cur = IO_STATE[ownerKey].usbIfs || [];
  const dualOk = usbDualIfSupported();
  const disabled = !dualOk;
  const items = list.map(x=>{
    const checked = cur.includes(x);
    const dis = disabled ? "disabled" : "";
    const cls = disabled ? "style='opacity:.45;cursor:not-allowed'" : "";
    return `<label ${cls} title="${disabled?'当前芯片不支持同时选择 FUSB 和 HUSB':''}">
      <input type="checkbox" data-usb-owner="${ownerKey}" data-usb-if="${x}" ${checked?'checked':''} ${dis}> ${x}
    </label>`;
  }).join("");
  return `<div class="usb-chk">${items}</div>`;
}

function renderIO(){
  const ios = chipIOs();
  const d = CHIP_DEFAULT[IO_STATE.chip];
  if(IO_STATE.power.vcc33 !== IO_EMPTY && !ios.includes(IO_STATE.power.vcc33)) IO_STATE.power.vcc33 = d.vcc33;
  if(IO_STATE.power.iovdd !== IO_EMPTY && !ios.includes(IO_STATE.power.iovdd)) IO_STATE.power.iovdd = d.iovdd;
  if(!ios.includes(IO_STATE.key.port) || !ADKEY_ALLOWED_IO.has(IO_STATE.key.port)){
    const firstAllowed = ios.find(x=>ADKEY_ALLOWED_IO.has(x));
    if(firstAllowed) IO_STATE.key.port = firstAllowed;
  }
  normalizeDacMode();
  normalizeUsbIfs();

  if(IO_STATE.aux.detIo !== IO_EMPTY && !ios.includes(IO_STATE.aux.detIo)){
    IO_STATE.aux.detIo = "IO_PORTA_07";
  }
  if(IO_STATE.aux.enable && isAuxChannelBlocked(IO_STATE.aux.channel)){
    IO_STATE.aux.channel = "AUX3";
  }

      <div class="io-row"><label>波特率</label><select id="ioWsBaudPreset">${WS_BAUD_PRESETS.map(p=>`<option value="${p.label}" ${p.label===IO_STATE.ws2812.baudPreset?'selected':''}>${p.label}</option>`).join("")}</select></div>
      ${IO_STATE.ws2812.baudPreset === "其他" ? `<div class="io-row"><label>自定义值</label><input id="ioWsBaudCustom" value="${IO_STATE.ws2812.baudCustom}"></div>` : ``}
      <div class="io-row"><label>灯珠数</label><input id="ioWsNum" value="${IO_STATE.ws2812.ledNum}"></div>

          ${[IO_EMPTY,"红色","橙色","黄色","绿色","青色","蓝色","紫色"].map(c=>
            `<option ${c===IO_STATE.ws2812.defaultColor?'selected':''}>${c}</option>`
          ).join("")}
        </select>
      </div>
      <div class="io-row"><span class="hint">WS2812的T0H和T1H电平务必是2倍关系才能，硬件使用需经反相器(SN74LVC1G14)接 WS2812的DIN；波特率是3.3M/2.5M(0码高电平300ns则是3.3M，是400s则是2.5M)。只显示未占用 IO。</span></div>
    </div>

  <div class="io-card ${IO_STATE.ledPwm.enable?'':'off'}">
    ${cardHead("LED呼吸灯","ioLedEn",IO_STATE.ledPwm.enable)}
    <div class="card-body ${IO_STATE.ledPwm.enable?'':'locked'}">
      <div class="io-row"><label>PWM IO</label>${ioSelect("ioLedPort", IO_STATE.ledPwm.port, ios, BANNED_PWM, "ledPwm.port")}</div>

    </div>
  </div>
  `;

  /* ===== 绑定 ===== */
  const bindCardEn = (id, key) => {
    const el = $(id);
    if(el) el.onchange = e=>{
      IO_STATE[key].enable = e.target.checked;
      normalizeUsbIfs();
      renderIO();
      renderMacro();
    };

  bindCardEn("ioDebugEn","debug");
  bindCardEn("ioPowerEn","power");
  bindCardEn("ioKeyEn","key");
  bindCardEn("ioMicEn","mic");
  bindCardEn("ioIicEn","iic");
  bindCardEn("ioSpiEn","spi");
  bindCardEn("ioSdioEn","sdio");
  bindCardEn("ioSdPlayEn","sdPlay");
  bindCardEn("ioUdiskEn","udisk");
  bindCardEn("ioAuxEn","aux");
  bindCardEn("ioLteEn","lte");

  /* WS2812 与 LED呼吸灯 互斥：WS2812 使能 */

      renderIO();
      renderMacro();
    };
  }

  /* WS2812 与 LED呼吸灯 互斥：LED呼吸灯 使能 */
  if($("ioLedEn")){
    $("ioLedEn").onchange = e=>{
      if(e.target.checked && IO_STATE.ws2812.enable){
        openTip("「WS2812 灯带」与「LED 呼吸灯」只能选择其中一个。<br><br>请先关闭 <b>WS2812 灯带</b>，再开启 LED 呼吸灯。");

      normalizeUsbIfs();

  if(sdPlayEnEl){

    sdPlayEnEl.onchange = e=>{

        IO_STATE.sdPlay.enable = false;

        renderMacro();

    };

  $("ioChip").onchange = e=>{
    IO_STATE.chip = e.target.value;

    normalizeUsbIfs();

    renderMacro();

  if($("ioDebugBaudCustom")) $("ioDebugBaudCustom").onchange = e=>{ IO_STATE.debug.baudCustom = +e.target.value; saveCfg(); };

  if($("ioKeyPull")) $("ioKeyPull").onchange = e=>{ IO_STATE.key.pullup = +e.target.value; saveCfg(); };

  g.querySelectorAll('[data-keyres]').forEach(sel=>{
    sel.onchange = e=>{
      const i = +e.target.dataset.keyres;
      const newRes = Number(e.target.value);

      keys.resistor = newRes;
      if(newRes !== 0 && keys.funcs && keys.funcs.long === 1){
        keys.funcs.long = 0;
      }
      renderIO();
    };
  });
  g.querySelectorAll('[data-key]').forEach(sel=>{
    sel.onchange = e=>{
      const i = +e.target.dataset.key;
      const slot = e.target.dataset.slot;
      const v = Number(e.target.value)||0;
      const keys = IO_STATE.key.keys[i];
      if(!keys.funcs || typeof keys.funcs !== "object") keys.funcs = defaultKeyFuncs();
      if(slot === "long" && v === 1 && keys.resistor !== 0){
        openTip("长按开关机功能只能选择在 0Ω 电阻上。请先将该按键的电阻设置为 0Ω。");
        e.target.value = keys.funcs[slot] || 0;
        return;
      }
      keys.funcs[slot] = v;
      renderIO();
    };
  });

  if($("ioMicMode")) $("ioMicMode").onchange = e=>{ IO_STATE.mic.mode = e.target.value; renderIO(); };
  if($("ioMicSingleGroup")) $("ioMicSingleGroup").onchange = e=>{ IO_STATE.mic.singleGroup = e.target.value; renderIO(); };
  g.querySelectorAll('[data-micdual]').forEach(sel=>{
    sel.onchange = e=>{
      const i = +e.target.dataset.micdual;
      IO_STATE.mic.dual[i] = e.target.value;
      if(IO_STATE.mic.dual[0] === IO_STATE.mic.dual[1]){

      }
      renderIO();
    };
  });
  if($("ioEchoEnInner")) $("ioEchoEnInner").onchange = e=>{ IO_STATE.echo.enable = e.target.checked; renderIO(); };
  if($("ioEchoGroup")) $("ioEchoGroup").onchange = e=>{ IO_STATE.echo.group = e.target.value; renderIO(); };

  if($("ioDacMode")) $("ioDacMode").onchange = e=>{ IO_STATE.dac.mode = e.target.value; normalizeDacMode(); renderIO(); };
  if($("ioDacSingleDiff")) $("ioDacSingleDiff").onchange = e=>{ IO_STATE.dac.singleDiff = e.target.value; renderIO(); };
  if($("ioDacMuteIo")) $("ioDacMuteIo").onchange = e=>{ IO_STATE.dac.muteIo = e.target.value; renderIO(); };
  if($("ioDacMuteLevel")) $("ioDacMuteLevel").onchange = e=>{ IO_STATE.dac.muteLevel = +e.target.value; saveCfg(); };
  if($("ioDacAutoMute")) $("ioDacAutoMute").onchange = e=>{ IO_STATE.dac.autoMute = +e.target.value; saveCfg(); };

  if($("ioChargeFullDet")) $("ioChargeFullDet").onchange = e=>{ IO_STATE.charge.fullDetIo = e.target.value; renderIO(); };
  if($("ioChargeChargingDet")) $("ioChargeChargingDet").onchange = e=>{ IO_STATE.charge.chargingDetIo = e.target.value; renderIO(); };

  g.querySelectorAll('[data-iic-en]').forEach(cb=>{

      renderIO();

  IO_STATE.iic.list.forEach((it,i)=>{

    const sda = $(`iic_sda_${i}`);
    if(sda) sda.onchange = e=>{ IO_STATE.iic.list[i].sda = e.target.value; renderIO(); };
  });
  g.querySelectorAll('[data-iic-delay]').forEach(inp=>{
    inp.onchange = e=>{
      const i = +e.target.dataset.iicDelay;
      let v = parseInt(e.target.value,10);
      if(isNaN(v)) v = 20;
      v = Math.max(1, Math.min(255, v));
      IO_STATE.iic.list[i].delay = v;
      e.target.value = v;
      saveCfg();
    };
  });
  const addIic = $("ioIicAdd");
  if(addIic) addIic.onclick = ()=>{
    if(IO_STATE.iic.list.length >= 2) return;
    IO_STATE.iic.list.push({ ...IIC1_DEFAULT });
    renderIO();
  };

  if($("ioSpiBus")) $("ioSpiBus").onchange = e=>{ IO_STATE.spi.bus = e.target.value; renderIO(); };
  if($("ioSpiDuplex")) $("ioSpiDuplex").onchange = e=>{ IO_STATE.spi.duplex = e.target.value; renderIO(); };
  if($("ioSpiSpeed")) $("ioSpiSpeed").onchange = e=>{ IO_STATE.spi.speed = e.target.value; saveCfg(); };
  if($("ioSpiCs")) $("ioSpiCs").onchange = e=>{ IO_STATE.spi.cs = e.target.value; renderIO(); };
  if($("ioSpiRs")) $("ioSpiRs").onchange = e=>{ IO_STATE.spi.rs = e.target.value; renderIO(); };
  if($("ioSpiTe")) $("ioSpiTe").onchange = e=>{ IO_STATE.spi.te = e.target.value; renderIO(); };
  if($("ioSpiRst")) $("ioSpiRst").onchange = e=>{ IO_STATE.spi.rst = e.target.value; renderIO(); };
  if($("ioSpiBl")) $("ioSpiBl").onchange = e=>{ IO_STATE.spi.bl = e.target.value; renderIO(); };
  if($("ioSpiCs1")) $("ioSpiCs1").onchange = e=>{ IO_STATE.spi.cs1 = e.target.value; renderIO(); };
  if($("ioSpiPower")) $("ioSpiPower").onchange = e=>{ IO_STATE.spi.power = e.target.value; renderIO(); };
  if($("ioTouchEn")) $("ioTouchEn").onchange = e=>{ IO_STATE.spi.touchEn = e.target.checked; renderIO(); };
  if($("ioTouchInt")) $("ioTouchInt").onchange = e=>{ IO_STATE.spi.touchInt = e.target.value; renderIO(); };
  if($("ioTouchReset")) $("ioTouchReset").onchange = e=>{ IO_STATE.spi.touchReset = e.target.value; renderIO(); };
  if($("ioTouchIic")) $("ioTouchIic").onchange = e=>{
    const v = e.target.value;
    if(!enabledIicIds().includes(v)){
      openTip(`触摸选择的 ${v} 尚未开启。<br>请先在 “软件IIC接口” 中开启 ${v}，再选择触摸 IIC。`);

  if($("ioSdioWidth")) $("ioSdioWidth").onchange = e=>{ IO_STATE.sdio.width = +e.target.value; renderIO(); };
  if($("ioSdioDetMode")) $("ioSdioDetMode").onchange = e=>{ IO_STATE.sdio.detMode = e.target.value; renderIO(); };
  if($("ioSdioDetIo")) $("ioSdioDetIo").onchange = e=>{ IO_STATE.sdio.detIo = e.target.value; renderIO(); };
  if($("ioSdioDetLevel")) $("ioSdioDetLevel").onchange = e=>{ IO_STATE.sdio.detLevel = +e.target.value; saveCfg(); };
  if($("ioSdioClk")) $("ioSdioClk").onchange = e=>{ IO_STATE.sdio.clk = e.target.value; saveCfg(); };

  if($("ioSdAutoPlay")) $("ioSdAutoPlay").onchange = e=>{ IO_STATE.sdPlay.autoPlay = e.target.checked; saveCfg(); };
  if($("ioUdiskAutoPlay")) $("ioUdiskAutoPlay").onchange = e=>{ IO_STATE.udisk.autoPlay = e.target.checked; saveCfg(); };
  if($("ioAuxAutoPlay")) $("ioAuxAutoPlay").onchange = e=>{ IO_STATE.aux.autoPlay = e.target.checked; saveCfg(); };

  g.querySelectorAll('[data-usb-owner]').forEach(cb=>{

      if(e.target.checked){
        if(!arr.includes(iface)) arr.push(iface);
      } else {
        arr = arr.filter(x=>x!==iface);
      }

      normalizeUsbIfs();
      renderIO();

  });

  if($("ioAuxDet")) $("ioAuxDet").onchange = e=>{ IO_STATE.aux.detIo = e.target.value; renderIO(); };
  if($("ioAuxChannel")) $("ioAuxChannel").onchange = e=>{ IO_STATE.aux.channel = e.target.value; renderIO(); };

  if($("ioLteDefaultNet")) $("ioLteDefaultNet").onchange = e=>{ IO_STATE.lte.defaultNetChannel = +e.target.value; saveCfg(); };
  if($("ioLtePower")) $("ioLtePower").onchange = e=>{ IO_STATE.lte.power = e.target.value; renderIO(); };
  if($("ioLteUsbSwitch")) $("ioLteUsbSwitch").onchange = e=>{ IO_STATE.lte.usbSwitch = e.target.value; renderIO(); };

  if($("ioWsTx")) $("ioWsTx").onchange = e=>{ IO_STATE.ws2812.tx = e.target.value; renderIO(); };
  if($("ioWsBaudPreset")) $("ioWsBaudPreset").onchange = e=>{ IO_STATE.ws2812.baudPreset = e.target.value; renderIO(); };
  if($("ioWsBaudCustom")) $("ioWsBaudCustom").onchange = e=>{ IO_STATE.ws2812.baudCustom = +e.target.value; saveCfg(); };
  if($("ioWsNum")) $("ioWsNum").onchange = e=>{ IO_STATE.ws2812.ledNum = +e.target.value; saveCfg(); };
  if($("ioWsDefaultColor")) $("ioWsDefaultColor").onchange = e=>{ IO_STATE.ws2812.defaultColor = e.target.value; saveCfg(); };

  if($("ioLedPort")) $("ioLedPort").onchange = e=>{ IO_STATE.ledPwm.port = e.target.value; updateLedCh(); renderIO(); };
  if($("ioLedFreqPreset")) $("ioLedFreqPreset").onchange = e=>{ IO_STATE.ledPwm.freqPreset = e.target.value; renderIO(); };
  if($("ioLedFreqCustom")) $("ioLedFreqCustom").onchange = e=>{ IO_STATE.ledPwm.freqCustom = +e.target.value; saveCfg(); };

  updateLedCh();
  updateConflicts();
  saveCfg();
}

function updateLedCh(){
  IO_STATE.ledPwm.ch = PWM_MAP[IO_STATE.ledPwm.port] || "PWM_TIMER3_OPCH3";
  const el = $("ioLedCh"); if(el) el.value = IO_STATE.ledPwm.ch;
}

let lastConflictKey = "";
function updateConflicts(){
  const used = collectUsage();
  const ioConflicts = Object.entries(used).filter(([io,arr])=>arr.length>1);
  const usbConf = usbConflicts();
  const box = $("conflictBox");
  const hasAny = ioConflicts.length || usbConf.length;

  if(hasAny){
    box.classList.add("show");
    let html = "";
    if(ioConflicts.length){
      html += `<b>⚠ IO 冲突：</b>` + ioConflicts.map(([io,arr])=>
        `<span style="display:inline-block;margin-left:10px">${io} → ${arr.map(x=>x.label).join(" / ")}</span>`).join("");
    }
    if(usbConf.length){
      if(ioConflicts.length) html += `<br>`;
      html += `<b>⚠ USB 占用冲突：</b>` + usbConf.map(c=>
        `<span style="display:inline-block;margin-left:10px">${c.iface} → ${c.owners.join(" / ")}</span>`).join("");
    }
    box.innerHTML = html;

    const key = JSON.stringify({
      io: ioConflicts.map(([io,arr])=>io+":"+arr.map(x=>x.id).sort().join(",")).sort(),
      usb: usbConf.map(c=>c.iface+":"+c.owners.slice().sort().join(",")).sort()
    });
    if(key !== lastConflictKey){
      lastConflictKey = key;
      openConflictModal(ioConflicts, usbConf);
    }
  } else {
    box.classList.remove("show");
    box.innerHTML = "";
    lastConflictKey = "";
  }
}
function openConflictModal(ioConflicts, usbConf){
  const body = $("conflictModalBody");
  let html = "";
  if(ioConflicts && ioConflicts.length){
    html += ioConflicts.map(([io,arr])=>
      `<div class="c-item"><span class="io">${esc(io)}</span> 被以下模块同时占用：<br>${arr.map(x=>"• "+esc(x.label)).join("<br>")}</div>`
    ).join("");
  }
  if(usbConf && usbConf.length){
    html += usbConf.map(c=>
      `<div class="c-item"><span class="io">${esc(c.iface)}</span> 被以下功能同时占用：<br>${c.owners.map(x=>"• "+esc(x)).join("<br>")}</div>`
    ).join("");
  }
  html += `<div style="color:var(--dim);margin-top:10px;font-size:12px">请修改冲突的 IO 或 USB 接口，或关闭对应模块的使能。</div>`;
  body.innerHTML = html;
  $("conflictModal").classList.add("open");
}
$("btnCloseConflict").onclick = ()=> $("conflictModal").classList.remove("open");
$("btnCloseConflict2").onclick = ()=> $("conflictModal").classList.remove("open");
$("conflictModal").addEventListener("click", e=>{
  if(e.target === $("conflictModal")) $("conflictModal").classList.remove("open");
});

function openTip(html){
  $("tipModalBody").innerHTML = html;
  $("tipModal").classList.add("open");
}
$("btnCloseTip").onclick = ()=> $("tipModal").classList.remove("open");
$("btnCloseTip2").onclick = ()=> $("tipModal").classList.remove("open");
$("tipModal").addEventListener("click", e=>{
  if(e.target === $("tipModal")) $("tipModal").classList.remove("open");
});

/* ============================================================
 * 6. 头文件生成（IO + 功能模块）

function genHeader(){
  const L = [];
  L.push(`#ifndef CONFIG_BOARD_OPEN_DEV_CFG_H`);
  L.push(`#define CONFIG_BOARD_OPEN_DEV_CFG_H`);
  L.push("");
  L.push("/*");
  L.push(" * board_open_dev_cfg.h");

 * 7. 抽屉 / tabs / 生成
 * ============================================================ */
const drawer=$("drawer"), output=$("output");
$("btnCloseDrawer").onclick = ()=> drawer.classList.remove("open");
drawer.addEventListener("click", e=>{ if(e.target===drawer) drawer.classList.remove("open"); });

/* “复制”按钮的中央提示气泡 */
function showCopyBubble(){
  const bubble = $("copyBubble");
  if(!bubble) return;
  /* 移除原来的局部气泡显示逻辑，改为中央 toast 提示 */
  toast("已复制");
}

$("btnCopy").onclick = async ()=>{
  try{
    await navigator.clipboard.writeText(output.value);
  }catch{
    output.select();
    document.execCommand("copy");
  }
  showCopyBubble();
};

$("btnDownload").onclick = ()=>{
  const blob = new Blob([output.value], {type:"text/plain;charset=utf-8"});
  const a = document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="board_open_dev_cfg.h"; a.click(); URL.revokeObjectURL(a.href); toast("已生成");
};

document.querySelectorAll(".tabs button").forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    const tab = btn.dataset.tab;
    $("tab-macro").classList.toggle("hidden", tab!=="macro");
    $("tab-io").classList.toggle("hidden", tab!=="io");
  };
});
$("chipSelect").onchange = e=>{
  IO_STATE.chip = e.target.value;
  const d = CHIP_DEFAULT[IO_STATE.chip];
  IO_STATE.power.vcc33 = d.vcc33;
  IO_STATE.power.iovdd = d.iovdd;
  normalizeDacMode();
  normalizeUsbIfs();
  enforceWakeWordForChip(); 
  renderIO();
  renderMacro();
};

$("btnResetCfg").onclick = ()=>{
  if(!confirm("确定要清除已保存的页面配置，并恢复默认吗？")) return;
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  location.reload();
};

$("btnGenHeaderTop").onclick = ()=>{
  const badKey = validateMicGainParams();
  if(badKey){
    openTip(`麦克风/回采增益参数 <b>${esc(badKey)}</b> 格式错误，无法生成配置文件。<br><br>请按 <b>y = ax + b</b> 的格式填写，例如：<code>y = -0.5x + 80</code>。<br>支持省略 y=、空格，以及 a 为 +1/-1 的简写（如 <code>x + 5</code>）。`);
    return;
  }
  const btName = MODULE_STATE.system.btName || "";
  const btBytes = utf8ByteLength(btName);
  if(btBytes > BT_NAME_MAX_BYTES){
    openTip(`经典蓝牙名称 <b>${esc(btName)}</b> 共 <b>${btBytes}</b> 字节，超过 ${BT_NAME_MAX_BYTES} 字节限制（UTF-8 编码）。<br><br>请修改“系统配置 → 经典蓝牙名称”。`);
    return;
  }
  const txt = genHeader();
  output.value = txt;
  drawer.classList.add("open");
  toast("已生成 board_open_dev_cfg.h");
};

loadCfg();
renderMacro();
renderIO();
</script>
</body>
